services:
  NBK:
    build:
      context: .
      dockerfile: build_scripts/docker/Dockerfile
    image: pikaraoke:local
    container_name: nerdBarKaraoke
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    command: >
      -u ${ADDRESS}
      --admin-password ${ADMIN_PASSWORD}
    volumes:
      - ./songs:/app/pikaraoke-songs      
      - ./data:/home/pikaraoke/.pikaraoke
    ports:
      - "5555:5555"
    restart: always

tunnel:
    image: fatedier/frpc:latest
    container_name: tunnel
    restart: always
    env_file: .env
    volumes:
      - ./tunnel.toml:/etc/frp/frpc.toml
    depends_on:
      - NBK
